name: Publish course website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Package Session 5 weather chatbot
        working-directory: 05-Building-MCP-Server-and-Client
        run: |
          zip -X practice/session-5-weather-mcp.zip \
            practice/mcp_chatbot.py \
            practice/weather_chatbot_with_resources.py \
            practice/weather_mcp_server_with_resources.py \
            practice/web_chat.py \
            practice/chat_store.py \
            practice/index.html \
            practice/requirements.txt \
            sample_data/reference_cities.json \
            sample_data/activity.md \
            sample_data/comfort.md

      - name: Render website
        run: quarto render

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
