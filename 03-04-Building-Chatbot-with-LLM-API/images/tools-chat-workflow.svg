<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220" role="img" aria-labelledby="title description">
  <title id="title">Python tool workflow</title>
  <desc id="description">Define a Python function, describe its tool inputs, map the tool name to the function, then call it from chat.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39728e"/></marker></defs>
  <rect width="1600" height="220" rx="24" fill="#f4f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="40" y="32" width="320" height="156" rx="18" fill="#ffffff" stroke="#bcd3e6" stroke-width="2"/>
    <text x="200" y="101" font-size="27" font-weight="700" fill="#172033">Function definition</text>
    <text x="200" y="142" font-size="18" fill="#5c6577">Write the Python function</text>
    <path d="M372 110H428" stroke="#39728e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="440" y="32" width="320" height="156" rx="18" fill="#ffffff" stroke="#bcd3e6" stroke-width="2"/>
    <text x="600" y="101" font-size="27" font-weight="700" fill="#172033">Tool definition</text>
    <text x="600" y="142" font-size="18" fill="#5c6577">Describe its purpose and inputs</text>
    <path d="M772 110H828" stroke="#39728e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="840" y="32" width="320" height="156" rx="18" fill="#ffffff" stroke="#bcd3e6" stroke-width="2"/>
    <text x="1000" y="101" font-size="27" font-weight="700" fill="#172033">Mapping</text>
    <text x="1000" y="142" font-size="18" fill="#5c6577">Link the tool name to the function</text>
    <path d="M1172 110H1228" stroke="#39728e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1240" y="32" width="320" height="156" rx="18" fill="#003d7a" stroke="#bcd3e6" stroke-width="2"/>
    <text x="1400" y="101" font-size="27" font-weight="700" fill="#ffffff">Calling</text>
    <text x="1400" y="142" font-size="18" fill="#d1e5f5">Run the function from chat</text>
  </g>
</svg>
