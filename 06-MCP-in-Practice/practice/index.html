<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Event Briefing</title>
  <style>
    body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    #conversation p { white-space: pre-wrap; overflow-wrap: anywhere; }
    form { display: grid; gap: .5rem; }
    input, button { font: inherit; padding: .5rem; }
    button { justify-self: start; }
  </style>
</head>
<body>
  <main>
    <h1>MCP Event Briefing</h1>
    <p>Ask about the Perth photography walk and its simulated weather.</p>
    <div id="conversation" role="log" aria-label="Chat messages"></div>
    <form id="chat-form">
      <label for="question">Your question</label>
      <input id="question" name="message" required maxlength="2000"
             placeholder="Brief me on the Perth photography walk.">
      <button id="send" type="submit">Send</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script>
    const form = document.querySelector("#chat-form");
    const question = document.querySelector("#question");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");
    const conversation = document.querySelector("#conversation");

    function showMessage(speaker, text) {
      const paragraph = document.createElement("p");
      paragraph.textContent = speaker + ": " + text;
      conversation.append(paragraph);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = question.value.trim();
      if (!message || send.disabled) return;
      send.disabled = true;
      status.textContent = "Waiting for a reply…";
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error("The request could not be completed. Try again.");
        const { reply } = await response.json();
        showMessage("You", message);
        showMessage("Assistant", reply);
        question.value = "";
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        send.disabled = false;
        question.focus();
      }
    });
  </script>
</body>
</html>
