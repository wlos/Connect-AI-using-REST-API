    - 02-Creating-APIs-with-FastAPI/sample_data/retail_sales.csv
    - 03-04-Building-a-Chatbot-with-LLM-API/practice/weather_chatbot.py
    - "03-04-Building-a-Chatbot-with-LLM-API/practice/Session 3-4 Practice Chatbot with Multiple Tools.ipynb"
