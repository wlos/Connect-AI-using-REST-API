website:
  title: "Build AI Apps with REST API & MCP"
  site-url: "https://wlos.github.io/Connect-AI-using-REST-API/"
  repo-url: "https://github.com/wlos/Connect-AI-using-REST-API"
  repo-actions:
    - source
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Mindmap"
        href: mindmap.html
      - text: "Session 1"
        href: "01-Introduction-to-REST-API/Session 1 Introduction to Connect AI with Business Systems using REST.ipynb"
      - text: "Session 2"
        href: "02-Creating-APIs-with-FastAPI/Session 2 Creating APIs with FastAPI.ipynb"
      - text: "Sessions 3–4"
        href: "03-04-Building-a-Chatbot-with-LLM-API/Session 3-4 Building a Chatbot with an LLM API.ipynb"
      - text: "Session 5"
        href: "05-Introduction-to-MCP/Session 5 Introduction to MCP.ipynb"
  sidebar:
    style: floating
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - text: "Course Mindmap"
        href: mindmap.html
      - section: "Course Sessions"
        contents:
          - text: "Session 1: Introduction to REST API"
            href: "01-Introduction-to-REST-API/Session 1 Introduction to Connect AI with Business Systems using REST.ipynb"
          - text: "Session 2: Creating APIs with FastAPI"
            href: "02-Creating-APIs-with-FastAPI/Session 2 Creating APIs with FastAPI.ipynb"
          - text: "Sessions 3–4: Chatbot with LLM API"
            href: "03-04-Building-a-Chatbot-with-LLM-API/Session 3-4 Building a Chatbot with an LLM API.ipynb"
          - text: "Session 5: Introduction to MCP"
            href: "05-Introduction-to-MCP/Session 5 Introduction to MCP.ipynb"
  page-footer:
    left: "Build AI Apps with REST API & MCP (ICTPRG553) course materials"
    right:
      - icon: github
        href: "https://github.com/wlos/Connect-AI-using-REST-API"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: true
    code-copy: true
    code-overflow: scroll
    smooth-scroll: true

execute:
  enabled: false
