project:
  type: website
  output-dir: _site
  resources:
    - assets/session2/setup_api_ss.bat
    - assets/session2/main.py
    - assets/session2/stage3_weather.py
    - assets/session2/stage2_demo.py
    - practice/session3/weather_chatbot.py
    - practice/session5/weather_mcp_server.py
    - assets/session5/requirements.txt
    - practice/session5/setup_mcp_ss.bat
    - practice/session5/mcp_chatbot.py
    - practice/session5/mcp_client.py
    - practice/session5/mcp_client_stdio.py
    - practice/session5/multi_tool_mcp_server.py
    - practice/session5/mcp_multi_tool_chatbot.py
  render:
    - index.qmd
    - "Session 1 Introduction to Connect AI with Business Systems using REST.ipynb"
    - "Session 2 Creating APIs with FastAPI.ipynb"
    - "Session 3-4 Building a Chatbot with an LLM API.ipynb"
    - "practice/session3/Session 3-4 Practice Chatbot with Multiple Tools.ipynb"
    - "Session 5 Introduction to MCP.ipynb"

website:
  title: "Connect AI with Business Systems using REST"
  site-url: "https://wlos.github.io/Connect-AI-using-REST-API/"
  repo-url: "https://github.com/wlos/Connect-AI-using-REST-API"
  repo-actions:
    - source
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Session 1"
        href: "Session 1 Introduction to Connect AI with Business Systems using REST.ipynb"
      - text: "Session 2"
        href: "Session 2 Creating APIs with FastAPI.ipynb"
      - text: "Session 3-4"
        href: "Session 3-4 Building a Chatbot with an LLM API.ipynb"
      - text: "Session 5"
        href: "Session 5 Introduction to MCP.ipynb"
  sidebar:
    style: floating
    search: true
    contents:
      - index.qmd
      - section: "Course Sessions"
        contents:
          - "Session 1 Introduction to Connect AI with Business Systems using REST.ipynb"
          - "Session 2 Creating APIs with FastAPI.ipynb"
          - "Session 3-4 Building a Chatbot with an LLM API.ipynb"
          - "Session 5 Introduction to MCP.ipynb"
  page-footer:
    left: "Connect AI with Business Systems using REST (ICTPRG553) course materials"
    right:
      - icon: github
        href: "https://github.com/wlos/Connect-AI-using-REST-API"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-title: "On this page"
    toc-depth: 3
    toc-expand: true
    code-copy: true
    code-overflow: scroll
    smooth-scroll: true

execute:
  enabled: false
