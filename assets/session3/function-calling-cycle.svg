<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title description">
  <title id="title">Weather function calling cycle</title>
  <desc id="description">Follow the arrows from the top left: the user asks for Perth weather; the model requests get_weather with a call ID; Python runs the function and queries WeatherAPI; WeatherAPI returns current observations; Python sends the matching tool result back to the model; the model generates the final answer. Weather values shown are examples.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39728e"/>
    </marker>
  </defs>
  <rect width="1440" height="680" rx="24" fill="#f4f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="40" width="360" height="250" rx="18" fill="#ffffff" stroke="#bcd3e6" stroke-width="2"/>
    <rect x="40" y="40" width="360" height="7" rx="3" fill="#0066cc"/>
    <text x="66" y="88" font-size="16" font-weight="700" letter-spacing="1.5" fill="#0066cc">1  USER INPUT</text>
    <text x="66" y="130" font-size="28" font-weight="700" fill="#172033">Ask about weather</text>
    <rect x="64" y="158" width="312" height="104" rx="10" fill="#eef5ff"/>
    <text x="84" y="194" font-size="21" fill="#003d7a">What is the current</text>
    <text x="84" y="226" font-size="21" fill="#003d7a">weather in Perth?</text>

    <path d="M 412 169 H 528" stroke="#39728e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="470" y="120" text-anchor="middle" font-size="16" fill="#39728e">History</text>
    <text x="470" y="145" text-anchor="middle" font-size="16" fill="#39728e">+ tools</text>

    <rect x="540" y="40" width="360" height="250" rx="18" fill="#003d7a"/>
    <text x="566" y="88" font-size="16" font-weight="700" letter-spacing="1.5" fill="#99e5e5">2  LLM TOOL REQUEST</text>
    <text x="566" y="130" font-size="28" font-weight="700" fill="#ffffff">Select a function</text>
    <text x="566" y="179" font-family="Menlo, Consolas, monospace" font-size="22" fill="#ffffff">get_weather</text>
    <text x="566" y="216" font-family="Menlo, Consolas, monospace" font-size="19" fill="#d1e5f5">city: "Perth"</text>
    <text x="566" y="253" font-size="18" fill="#d1e5f5">Call ID: call_123</text>

    <path d="M 912 169 H 1028" stroke="#39728e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="970" y="133" text-anchor="middle" font-size="16" fill="#39728e">Tool call</text>

    <rect x="1040" y="40" width="360" height="250" rx="18" fill="#ffffff" stroke="#bcd3e6" stroke-width="2"/>
    <rect x="1040" y="40" width="360" height="7" rx="3" fill="#0066cc"/>
    <text x="1066" y="88" font-size="16" font-weight="700" letter-spacing="1.5" fill="#0066cc">3  PYTHON EXECUTION</text>
    <text x="1066" y="130" font-size="28" font-weight="700" fill="#172033">Run the function</text>
    <text x="1066" y="182" font-family="Menlo, Consolas, monospace" font-size="19" fill="#003d7a">get_weather("Perth")</text>
    <text x="1066" y="220" font-size="19" fill="#5c6577">Python calls WeatherAPI</text>
    <text x="1066" y="251" font-size="19" fill="#5c6577">to fetch current observations.</text>

    <path d="M 1220 302 V 378" stroke="#39728e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="1243" y="346" font-size="16" fill="#39728e">HTTPS request</text>

    <rect x="1040" y="390" width="360" height="250" rx="18" fill="#ffffff" stroke="#a8d7d4" stroke-width="2"/>
    <rect x="1040" y="390" width="360" height="7" rx="3" fill="#008080"/>
    <text x="1066" y="438" font-size="16" font-weight="700" letter-spacing="1.5" fill="#008080">4  WEATHER DATA</text>
    <text x="1066" y="480" font-size="28" font-weight="700" fill="#172033">Read the API result</text>
    <text x="1066" y="514" font-size="16" fill="#5c6577">Example data, simplified by Python</text>
    <rect x="1064" y="534" width="312" height="82" rx="10" fill="#edf8f5"/>
    <text x="1084" y="565" font-family="Menlo, Consolas, monospace" font-size="18" fill="#006b65">city: "Perth"</text>
    <text x="1084" y="595" font-family="Menlo, Consolas, monospace" font-size="18" fill="#006b65">25°C · Sunny</text>

    <path d="M 1028 519 H 912" stroke="#39728e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="970" y="483" text-anchor="middle" font-size="16" fill="#39728e">Tool result</text>

    <rect x="540" y="390" width="360" height="250" rx="18" fill="#003d7a"/>
    <text x="566" y="438" font-size="16" font-weight="700" letter-spacing="1.5" fill="#99e5e5">5  LLM FOLLOW-UP</text>
    <text x="566" y="480" font-size="28" font-weight="700" fill="#ffffff">Use the tool result</text>
    <text x="566" y="528" font-size="19" fill="#d1e5f5">Python sends the history,</text>
    <text x="566" y="560" font-size="19" fill="#d1e5f5">tool call and weather data</text>
    <text x="566" y="592" font-size="19" fill="#d1e5f5">with matching ID: call_123.</text>

    <path d="M 528 519 H 412" stroke="#39728e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="470" y="470" text-anchor="middle" font-size="16" fill="#39728e">Generated</text>
    <text x="470" y="495" text-anchor="middle" font-size="16" fill="#39728e">text</text>

    <rect x="40" y="390" width="360" height="250" rx="18" fill="#ffffff" stroke="#a8d7d4" stroke-width="2"/>
    <rect x="40" y="390" width="360" height="7" rx="3" fill="#008080"/>
    <text x="66" y="438" font-size="16" font-weight="700" letter-spacing="1.5" fill="#008080">6  FINAL ANSWER</text>
    <text x="66" y="480" font-size="28" font-weight="700" fill="#172033">Answer the user</text>
    <rect x="64" y="508" width="312" height="104" rx="10" fill="#edf8f5"/>
    <text x="84" y="545" font-size="21" fill="#006b65">It is currently 25°C</text>
    <text x="84" y="579" font-size="21" fill="#006b65">and sunny in Perth.</text>
  </g>
</svg>
